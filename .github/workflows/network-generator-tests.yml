name: Network generator tests

on:
  push:
    paths:
      - "network-config-generator/**"
      - ".github/workflows/network-generator-tests.yml"
  pull_request:
    paths:
      - "network-config-generator/**"
      - ".github/workflows/network-generator-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: network-config-generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: network-config-generator/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q app tests
      - name: Run tests
        run: pytest -q
