name: NetArchitect AI tests

on:
  pull_request:
    paths:
      - "network-config-generator/**"
      - ".github/workflows/netarchitect-tests.yml"
  push:
    branches: [main]
    paths:
      - "network-config-generator/**"
      - ".github/workflows/netarchitect-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: network-config-generator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: network-config-generator/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q
